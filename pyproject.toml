[project]
name = "clima-inflacao"
version = "0.1.0"
description = "Choques climáticos e inflação de alimentos no domicílio (IPCA) no Brasil"
requires-python = ">=3.11"
# As dependências ficam em requirements.txt, com versões fixadas.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clima_inflacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # o pycwt importa scipy.special.orthogonal (obsoleto, removido só no SciPy 2.0)
    "ignore:Please import `hermitenorm`:DeprecationWarning:pycwt.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Notebooks no formato percent importam ao longo das células.
"notebooks/*.py" = ["E402"]
# As fixtures reproduzem linhas reais dos CSVs do INMET, mais longas que 100 caracteres.
"tests/test_ingestao_clima.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clima_inflacao"]
